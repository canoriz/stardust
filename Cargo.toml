[package]
name = "stardust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
axum = "0.8"
bon = "3.8.1"
clap = { version = "4", features = ["derive"] }
bt_bencode = { git = "https://github.com/canoriz/bt_bencode", rev = "b6b64a9", features = [
    "raw_value",
] }
bytes = "1.10.1"
derivative = "2.2.0"
futures = "0.3.31"
hex = "0.4.3"
percent-encoding = "2.3.1"
pin-project = "1.1.10"
rand = { version = "0.9.0", features = ["thread_rng"] }
reqwest = "0.12.11"
serde = { version = "1.0.217", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.145"
sha1 = { version = "0.10.6", features = ["asm"] }
socket2 = "0.6.1"
thiserror = "2.0.9"
tokio = { version = "1", features = ["full", "tracing", "test-util"] }
tokio-test = "0.4.4"
tokio-util = "0.7.15"
tracing = { version = "0.1.41", features = ["release_max_level_debug"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# [patch."https://github.com/canoriz/bt_bencode"]
# bt_bencode = { path = "./bt_bencode" }

[target.'cfg(mloom)'.dependencies]
loom = { version = "0.7", features = ["checkpoint"] }

[lints.rust]
# TODO: What does this really do? Should it warn or not?
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(mloom)',
    'cfg(test_flush_migrate_concurrent)',
] }

[[bin]]
name = "main"
path = "src/bin/main.rs"

[[bin]]
name = "dht-client"
path = "src/bin/tools/dht_client.rs"

[lib]
path = "src/lib.rs"

[features]
mock_delay = []

[profile.release]
debug = true
strip = false
split-debuginfo = "off"
